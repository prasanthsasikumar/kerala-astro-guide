<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@700&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: oklch(98.5% 0.008 85); font-family: "Noto Sans Malayalam", sans-serif; color: oklch(22% 0.02 60); display: grid; grid-template-columns: 1fr 430px; }
  .left { padding: 72px 0 64px 80px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 76px; height: 76px; }
  .brand span { font: 700 30px "Noto Serif Malayalam", serif; color: oklch(50% 0.17 32); }
  h1 { font: 700 54px/1.25 "Noto Serif Malayalam", serif; margin: 36px 0 0; }
  .en { font-size: 26px; color: oklch(40% 0.02 60); margin: 12px 0 0; line-height: 1.35; }
  .tags { margin-top: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .tag { padding: 10px 20px; border-radius: 999px; background: white; border: 1px solid oklch(84% 0.015 80); font-size: 22px; font-weight: 600; }
  .tag.on { background: oklch(50% 0.17 32); color: white; border-color: oklch(50% 0.17 32); }
  .right { background: oklch(93% 0.04 85); display: grid; place-items: center; }
  .chart { width: 330px; height: 330px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 5px; padding: 5px; background: white; border-radius: 26px; border: 1px solid oklch(84% 0.015 80); }
  .c { background: oklch(98.5% 0.008 85); border-radius: 12px; font: 700 21px "Noto Serif Malayalam", serif; padding: 9px; color: oklch(30% 0.02 60); }
  .c.l { background: oklch(93% 0.04 85); }
  .mid { grid-row: 2 / 4; grid-column: 2 / 4; display: grid; place-items: center; }
  .mid img { width: 112px; height: 112px; }
  .url { position: absolute; right: 36px; bottom: 26px; font-size: 22px; color: oklch(40% 0.06 60); font-weight: 600; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../../public/logo-mark.png" alt=""><span>കേരള അസ്ട്രോ ഗൈഡ്</span></div>
    <h1>ജ്യോതിഷനോട് മലയാളത്തിൽ സംസാരിക്കാം</h1>
    <p class="en">Free Kerala astrology: talk to an astrologer, see your horoscope, match stars.</p>
    <div class="tags"><span class="tag on">ജ്യോതിഷി · Call</span><span class="tag">ജാതകം</span><span class="tag">പൊരുത്തം</span></div>
  </div>
  <div class="right">
    <div class="chart">
      <div class="c" style="grid-area:1/1">ശി</div><div class="c" style="grid-area:1/2">ഗു</div><div class="c" style="grid-area:1/3"></div><div class="c" style="grid-area:1/4">ച</div>
      <div class="c" style="grid-area:2/4"></div><div class="c l" style="grid-area:3/4">ല ര</div><div class="c" style="grid-area:4/4">ബു</div>
      <div class="c" style="grid-area:4/3">ശു</div><div class="c" style="grid-area:4/2">കു</div><div class="c" style="grid-area:4/1">മ</div>
      <div class="c" style="grid-area:3/1">സ</div><div class="c" style="grid-area:2/1"></div>
      <div class="mid"><img src="../../public/logo-mark.png" alt=""></div>
    </div>
  </div>
  <div class="url">astro.flowsxr.com</div>
</body></html>
